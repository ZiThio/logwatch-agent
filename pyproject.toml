[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logwatch-agent"
version = "0.1.0"
description = "Local-first log monitoring with rule-based alerts and optional RAG explanations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
rag = ["chromadb>=0.5,<2"]
test = []

[tool.setuptools.packages.find]
where = ["."]
include = ["logwatch_agent*"]
