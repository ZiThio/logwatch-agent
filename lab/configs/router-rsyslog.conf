# Router-side rsyslog: receive local messages (FRR, ulogd) and forward
# everything to the lab collector over TCP. Messages are queued if the
# collector is not reachable yet.
module(load="imuxsock")

*.* action(
    type="omfwd"
    target="172.20.20.50"
    port="514"
    protocol="tcp"
    queue.type="linkedList"
    action.resumeRetryCount="-1"
)
