# Central lab log receiver. Accepts syslog over UDP and TCP port 514 and
# writes every message to one file, which the LogWatch agent watches.
# RSYSLOG_FileFormat = "<RFC3339 timestamp> <host> <tag>: <message>",
# a format the agent's parser reads.
module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

*.* action(
    type="omfile"
    file="/var/log/remote/all.log"
    template="RSYSLOG_FileFormat"
    fileCreateMode="0644"
)
