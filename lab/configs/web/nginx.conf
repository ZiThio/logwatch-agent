# Lab web server. Both logs go to the syslog collector:
#  - access log: every request (tag "nginx")
#  - error log: includes basic-auth failures such as
#    'user "admin": password mismatch, client: 192.0.2.18' (tag "nginx_error")
worker_processes 1;
error_log syslog:server=172.20.20.50:514,tag=nginx_error warn;

events {
    worker_connections 64;
}

http {
    access_log syslog:server=172.20.20.50:514,tag=nginx combined;

    server {
        listen 80;
        root /usr/share/nginx/html;

        location / {
        }

        # Password-protected page used to generate authentication failures.
        # Lab-only credentials: admin / labpass123
        location /admin/ {
            auth_basic "LogWatch lab admin";
            auth_basic_user_file /etc/nginx/htpasswd;
            alias /usr/share/nginx/html/;
        }
    }
}
