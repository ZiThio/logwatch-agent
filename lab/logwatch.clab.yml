# LogWatch lab topology.
#
#   client1 (192.0.2.2) ─┐
#                        ├─ router1 ══ OSPF ══ router2 ── web (198.51.100.20, nginx)
#  attacker (192.0.2.18)─┘  (firewall)  10.0.12.0/30
#
# Every node also has a management interface (eth0) on 172.20.20.0/24.
# Logs travel over that network to the syslog collector (172.20.20.50),
# which writes them to lab/logs/all.log for the LogWatch agent.
#
# Build the images first: ./lab/scripts/build-images.sh
# Start:  sudo containerlab deploy  -t lab/logwatch.clab.yml
# Stop:   sudo containerlab destroy -t lab/logwatch.clab.yml

name: logwatch

mgmt:
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    syslog:
      kind: linux
      image: logwatch/syslog:lab
      mgmt-ipv4: 172.20.20.50
      binds:
        - ./configs/syslog/rsyslog.conf:/etc/rsyslog.conf:ro
        - ./logs:/var/log/remote

    router1:
      kind: linux
      image: logwatch/router:lab
      binds:
        - ./configs/router-start.sh:/usr/local/bin/lab-start:ro
        # Must be /etc/rsyslog.conf: on Ubuntu hosts, AppArmor's rsyslogd profile
        # also applies inside privileged containers and blocks other paths.
        - ./configs/router-rsyslog.conf:/etc/rsyslog.conf:ro
        - ./configs/router1/frr.conf:/etc/frr/frr.conf:ro
        - ./configs/router1/nftables.nft:/etc/nftables-lab.nft:ro
        - ./configs/router1/ulogd.conf.in:/etc/ulogd-lab.conf.in:ro
      exec:
        - sh /usr/local/bin/lab-start

    router2:
      kind: linux
      image: logwatch/router:lab
      binds:
        - ./configs/router-start.sh:/usr/local/bin/lab-start:ro
        - ./configs/router-rsyslog.conf:/etc/rsyslog.conf:ro
        - ./configs/router2/frr.conf:/etc/frr/frr.conf:ro
      exec:
        - sh /usr/local/bin/lab-start

    client1:
      kind: linux
      image: logwatch/host:lab
      exec:
        - ip addr add 192.0.2.2/28 dev eth1
        - ip route add 198.51.100.0/24 via 192.0.2.1

    attacker:
      kind: linux
      image: logwatch/host:lab
      exec:
        - ip addr add 192.0.2.18/28 dev eth1
        - ip route add 198.51.100.0/24 via 192.0.2.17

    web:
      kind: linux
      image: nginx:1.27-alpine
      binds:
        - ./configs/web/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./configs/web/htpasswd:/etc/nginx/htpasswd:ro
      exec:
        - ip addr add 198.51.100.20/24 dev eth1
        - ip route add 192.0.2.0/24 via 198.51.100.1

  links:
    - endpoints: ["client1:eth1", "router1:eth1"]
    - endpoints: ["attacker:eth1", "router1:eth2"]
    - endpoints: ["router1:eth3", "router2:eth1"]
    - endpoints: ["router2:eth2", "web:eth1"]
